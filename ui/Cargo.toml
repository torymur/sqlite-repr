[package]
name = "ui"
version = "0.1.0"
authors = ["Victoria Terenina (torymur) <torymur@gmail.com>"]
edition = "2021"

[[bin]]
name = "ui"
path = "src/main.rs"

[lib]
name = "ui"
path = "src/lib.rs"


[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-free-icons = { version = "0.10", features = ["bootstrap"] }
hex = { version = "0.4.3" }
parser = { path = "../parser" }
bytes = "1.11"

# Debug
dioxus-logger = "0.7.1"
